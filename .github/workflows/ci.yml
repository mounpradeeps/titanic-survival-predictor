name: Titanic App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-app:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py

      - name: Run model test
        run: |
          python test_model.py
